name: Publish to Cloudsmith

on:
  push:
    branches: [ "release/**" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: publish-nextlib
  cancel-in-progress: false

jobs:
  build:
    name: Publish nextlib
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate version and publishing credentials
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          CLOUDSMITH_USERNAME: ${{ secrets.CLOUDSMITH_USERNAME }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          [[ "$version" =~ ^[0-9][0-9A-Za-z.-]*$ ]] || { echo "Invalid VERSION_NAME"; exit 1; }
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
            echo "Tag must match configured version: v$version"
            exit 1
          fi
          if [[ "$REF_NAME" == release/* && "$REF_NAME" != "release/$version" ]]; then
            echo "Release branch must match configured version: release/$version"
            exit 1
          fi
          for secret in CLOUDSMITH_USERNAME CLOUDSMITH_API_KEY; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Missing repository secret: $secret"
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ (^|[.-])(alpha|beta|rc)[0-9.-]*$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Install pinned Android SDK tools
        run: |
          sdk_root="$RUNNER_TEMP/nextlib-android-sdk"
          cli_stage="$RUNNER_TEMP/nextlib-android-cli"
          mkdir -p "$sdk_root/cmdline-tools" "$cli_stage"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$cli_stage/tools.zip"
          unzip -q "$cli_stage/tools.zip" -d "$cli_stage"
          mv "$cli_stage/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          ndk_version=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          cmake_version=$(sed -n 's/^cmake = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          compile_sdk=$(sed -n 's/^androidCompileSdk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          "$sdkmanager" --licenses < <(yes) >/dev/null
          "$sdkmanager" "platforms;android-$compile_sdk" "build-tools;36.0.0" \
            "ndk;$ndk_version" "cmake;$cmake_version"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-cleanup: always

      - name: Install dav1d build tools
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build nasm

      - name: Check FFmpeg setup
        run: python3 ffmpeg/test_setup.py

      - name: Build and test release
        run: ./gradlew assembleRelease :media3ext:testDebugUnitTest --no-configuration-cache

      - name: Upload release AARs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nextlib-${{ steps.release.outputs.version }}
          if-no-files-found: error
          path: |
            media3ext/build/outputs/aar/media3ext-release.aar
            mediainfo/build/outputs/aar/mediainfo-release.aar

      - name: Publish to Cloudsmith
        run: ./gradlew publishAllPublicationsToCloudsmithRepository -PreleaseSigningEnabled=false --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_CloudsmithUsername: ${{ secrets.CLOUDSMITH_USERNAME }}
          ORG_GRADLE_PROJECT_CloudsmithPassword: ${{ secrets.CLOUDSMITH_API_KEY }}

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: false
          name: v${{ steps.release.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.release.outputs.prerelease }}
          tag_name: v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            media3ext/build/outputs/aar/media3ext-release.aar
            mediainfo/build/outputs/aar/mediainfo-release.aar
